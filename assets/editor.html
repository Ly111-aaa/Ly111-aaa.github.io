<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>博客编辑器</title>
<style>
:root{
  --bg:#fbfbfd; --fg:#1c1c1e; --muted:#6b7280; --card:#fff; --border:#e5e7eb;
  --accent:#2563eb; --code-bg:#f3f4f6; --danger:#dc2626; --ok:#059669;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af; --card:#171a21; --border:#262b36;
    --accent:#60a5fa; --code-bg:#1b1f27; --danger:#f87171; --ok:#34d399;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--fg);padding:7px 14px;transition:.15s}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{opacity:.9}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
input,textarea{font:inherit;color:var(--fg);background:var(--card);
  border:1px solid var(--border);border-radius:8px;padding:9px 12px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}

header{display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-bottom:1px solid var(--border);background:var(--card);flex-wrap:wrap}
header .title{font-weight:700;margin-right:auto}
header .title small{font-weight:400;color:var(--muted);margin-left:8px}

.layout{flex:1;display:flex;min-height:0}
aside{width:270px;border-right:1px solid var(--border);overflow-y:auto;
  padding:12px;background:var(--card);flex-shrink:0}
aside .new{width:100%;margin-bottom:12px}
.plist{list-style:none;margin:0;padding:0}
.plist li{padding:9px 11px;border-radius:8px;cursor:pointer;margin-bottom:3px;
  border:1px solid transparent;font-size:14px}
.plist li:hover{background:var(--code-bg)}
.plist li.active{background:var(--code-bg);border-color:var(--accent)}
.plist li .d{display:block;color:var(--muted);font-size:12px;margin-top:2px}

main{flex:1;display:flex;flex-direction:column;min-width:0;padding:16px;gap:10px}
.row{display:flex;gap:10px}
.row > *{flex:1}
.row .narrow{flex:0 0 160px}
.editor{flex:1;display:flex;flex-direction:column;min-height:0}
#body{flex:1;min-height:260px;resize:none;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:14px;line-height:1.75}
#preview{flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:8px;
  background:var(--card);padding:20px 24px;min-height:260px}
#preview h1{font-size:24px;margin:0 0 12px}
#preview h2{font-size:19px;margin:24px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
#preview h3{font-size:17px;margin:20px 0 8px}
#preview code{background:var(--code-bg);border-radius:4px;padding:2px 5px;font-size:13px}
#preview pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto}
#preview pre code{background:none;padding:0}
#preview blockquote{margin:14px 0;padding:8px 16px;border-left:3px solid var(--accent);
  background:var(--code-bg);border-radius:0 8px 8px 0;color:var(--muted)}
#preview img{max-width:100%;border-radius:8px}
#preview table{border-collapse:collapse;width:100%}
#preview th,#preview td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.hidden{display:none !important}

.status{font-size:13px;color:var(--muted);min-height:20px;display:flex;align-items:center;gap:8px}
.status.ok{color:var(--ok)}
.status.err{color:var(--danger)}
.hint{color:var(--muted);font-size:12px}
@media (max-width:760px){
  .layout{flex-direction:column}
  aside{width:auto;border-right:0;border-bottom:1px solid var(--border);max-height:180px}
}
</style>
</head>
<body>

<header>
  <span class="title">博客编辑器 <small id="count"></small></span>
  <a href="/" target="_blank"><button type="button">查看博客</button></a>
  <button type="button" id="btnPublish">发布到 GitHub</button>
</header>

<div class="layout">
  <aside>
    <button type="button" class="new primary" id="btnNew">+ 新建文章</button>
    <ul class="plist" id="list"></ul>
  </aside>

  <main>
    <div class="row">
      <input id="title" placeholder="标题" autocomplete="off">
    </div>
    <div class="row">
      <input id="category" class="narrow" placeholder="分类（可留空）" autocomplete="off">
      <input id="tags" placeholder="标签，用逗号分隔（可留空）" autocomplete="off">
    </div>

    <div class="editor">
      <textarea id="body" placeholder="在这里写正文，支持 Markdown&#10;&#10;## 小标题&#10;**粗体**  *斜体*  `代码`&#10;- 列表项"></textarea>
      <div id="preview" class="hidden"></div>
    </div>

    <div class="row" style="align-items:center">
      <div style="flex:0 0 auto;display:flex;gap:10px">
        <button type="button" class="primary" id="btnSave">保存</button>
        <button type="button" id="btnPreview">预览</button>
        <button type="button" class="danger" id="btnDelete">删除</button>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="hint">提示：Ctrl+S 保存。保存只写入 posts 目录，「发布到 GitHub」才会更新线上站点（约 1～2 分钟生效）。</div>
  </main>
</div>

<script>
const TOKEN = "__BLOG_TOKEN__";
let current = null;      // 当前文章的 slug，null 表示新文章
let previewing = false;

const $ = (id) => document.getElementById(id);
const statusEl = $('status');

function setStatus(msg, kind) {
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', 'X-Blog-Token': TOKEN, ...(options.headers || {}) },
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = { error: text }; }
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

/* ---------------- 列表 ---------------- */

async function refreshList(selectSlug) {
  const { posts } = await api('/api/posts');
  $('count').textContent = '共 ' + posts.length + ' 篇';
  const ul = $('list');
  ul.innerHTML = '';
  if (!posts.length) {
    ul.innerHTML = '<li style="cursor:default;color:var(--muted)">还没有文章，点上面新建。</li>';
    return;
  }
  for (const p of posts) {
    const li = document.createElement('li');
    li.className = p.slug === (selectSlug ?? current) ? 'active' : '';
    li.innerHTML = '<span></span><span class="d"></span>';
    li.children[0].textContent = p.title;
    li.children[1].textContent = p.date || '';
    li.onclick = () => loadPost(p.slug);
    ul.appendChild(li);
  }
}

/* ---------------- 读取 / 写入 ---------------- */

async function loadPost(slug) {
  setStatus('载入中…');
  const p = await api('/api/posts/' + encodeURIComponent(slug));
  current = slug;
  $('title').value = p.title || '';
  $('category').value = p.category || '';
  $('tags').value = (p.tags || []).join(', ');
  $('body').value = p.body || '';
  stopPreview();
  await refreshList(slug);
  setStatus('已载入：' + slug, 'ok');
}

function newPost() {
  current = null;
  $('title').value = '';
  $('category').value = '';
  $('tags').value = '';
  $('body').value = '';
  stopPreview();
  refreshList(null);
  $('title').focus();
  setStatus('新文章：填好标题和正文后点保存。');
}

async function save() {
  const title = $('title').value.trim();
  if (!title) { setStatus('请先填标题。', 'err'); $('title').focus(); return; }

  const payload = {
    title,
    category: $('category').value.trim(),
    tags: $('tags').value.split(',').map(s => s.trim()).filter(Boolean),
    body: $('body').value,
  };

  try {
    setStatus('保存中…');
    if (current) {
      await api('/api/posts/' + encodeURIComponent(current), { method: 'PUT', body: JSON.stringify(payload) });
      await refreshList(current);
      setStatus('已保存：' + current, 'ok');
    } else {
      const r = await api('/api/posts', { method: 'POST', body: JSON.stringify(payload) });
      current = r.slug;
      await refreshList(current);
      setStatus('已新建：' + r.slug, 'ok');
    }
  } catch (e) {
    setStatus('保存失败：' + e.message, 'err');
  }
}

async function removePost() {
  if (!current) { setStatus('还没有保存过的文章，无需删除。', 'err'); return; }
  if (!confirm('确定删除《' + $('title').value + '》？此操作会删除 posts 里的文件。')) return;
  try {
    setStatus('删除中…');
    await api('/api/posts/' + encodeURIComponent(current), { method: 'DELETE' });
    const gone = current;
    current = null;
    newPost();
    await refreshList(null);
    setStatus('已删除：' + gone, 'ok');
  } catch (e) {
    setStatus('删除失败：' + e.message, 'err');
  }
}

/* ---------------- 预览 ---------------- */

async function togglePreview() {
  if (previewing) { stopPreview(); return; }
  try {
    setStatus('渲染中…');
    const { html } = await api('/api/preview', { method: 'POST', body: JSON.stringify({ body: $('body').value }) });
    $('preview').innerHTML = html || '<p style="color:var(--muted)">（正文为空）</p>';
    $('body').classList.add('hidden');
    $('preview').classList.remove('hidden');
    $('btnPreview').textContent = '继续编辑';
    previewing = true;
    setStatus('');
  } catch (e) {
    setStatus('预览失败：' + e.message, 'err');
  }
}
function stopPreview() {
  previewing = false;
  $('preview').classList.add('hidden');
  $('body').classList.remove('hidden');
  $('btnPreview').textContent = '预览';
}

/* ---------------- 发布 ---------------- */

async function publish() {
  if (!$('btnPublish').dataset.armed) {
    $('btnPublish').dataset.armed = '1';
    setStatus('再点一次「发布到 GitHub」确认提交并推送。');
    setTimeout(() => { delete $('btnPublish').dataset.armed; }, 5000);
    return;
  }
  delete $('btnPublish').dataset.armed;
  $('btnPublish').disabled = true;
  try {
    setStatus('正在构建并推送…');
    const r = await api('/api/publish', { method: 'POST' });
    setStatus(r.message, r.ok ? 'ok' : 'err');
    if (!r.ok && r.log) console.warn(r.log);
  } catch (e) {
    setStatus('发布失败：' + e.message, 'err');
  } finally {
    $('btnPublish').disabled = false;
  }
}

/* ---------------- 事件 ---------------- */

$('btnNew').onclick = newPost;
$('btnSave').onclick = save;
$('btnDelete').onclick = removePost;
$('btnPreview').onclick = togglePreview;
$('btnPublish').onclick = publish;
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
});

(async () => {
  try {
    await refreshList(null);
    setStatus('就绪。点左侧文章编辑，或点「新建文章」。');
  } catch (e) {
    setStatus('初始化失败：' + e.message, 'err');
  }
})();
</script>
</body>
</html>
